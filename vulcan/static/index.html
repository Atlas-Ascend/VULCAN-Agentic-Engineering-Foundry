<!doctype html><html><head><meta charset=utf-8><meta name=viewport content="width=device-width,initial-scale=1"><title>VULCAN</title><style>body{margin:0;background:#100706;color:#fff2e7;font:15px system-ui}main{max-width:1180px;margin:auto;padding:30px}.hero,.card{background:#1a0c09;border:1px solid #693122;border-radius:18px;padding:22px;margin-bottom:14px}h1{font-size:48px;margin:0}button{padding:12px 18px;border:0;border-radius:9px;background:#ff9a66;font-weight:900}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.win{border-color:#ffbd52}.fail{border-color:#8b3a3a}.pass{color:#a7ffc4}.bad{color:#ff9a9a}pre{white-space:pre-wrap}@media(max-width:850px){.grid{grid-template-columns:1fr}}</style></head><body><main><section class=hero><small>JANUS-10 · ENTRY 09 · NEBIUS × NVIDIA</small><h1>VULCAN</h1><h2>Engineering is a tournament. Promotion requires proof.</h2><button onclick=run()>RUN ENGINEERING TOURNAMENT</button></section><div id=o></div></main><script>async function run(){let j=await(await fetch('/api/tournament',{method:'POST'})).json(),t=j.tournament;o.innerHTML=`<div class=grid>${t.candidates.map(c=>`<div class="card ${c.promoted?'win':(!c.verified?'fail':'')}"><h2>${c.id}${c.promoted?' · WINNER':''}</h2><p>${c.lineage} · risk ${c.risk} · revision ${c.revision}</p><h3>score ${c.score}</h3>${c.tests.map(x=>`<p class=${x.passed?'pass':'bad'}>${x.passed?'PASS':'FAIL'} · ${x.name} · ${x.actual}</p>`).join('')}</div>`).join('')}</div><div class=card><h2>Proof Receipt</h2><pre>${JSON.stringify(j.receipt,null,2)}</pre></div><div class=card><h2>Event Ledger</h2><pre>${JSON.stringify(t.events,null,2)}</pre></div><div class=card><h2>Sponsor Runtime Boundary</h2><pre>${JSON.stringify(j.sponsor_runtime,null,2)}</pre></div>`}</script></body></html>
