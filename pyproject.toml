[build-system]
requires=["setuptools>=68"]
build-backend="setuptools.build_meta"

[project]
name="vulcan-agentic-engineering-foundry"
version="0.1.0"
description="Governed multi-candidate engineering tournament with verification and proof"
requires-python=">=3.11,<3.14"
dependencies=["fastapi>=0.115,<1","uvicorn[standard]>=0.30,<1","pydantic>=2.8,<3","httpx>=0.27,<1"]

[project.optional-dependencies]
dev=["pytest>=8.2,<9"]

[tool.setuptools]
packages=["vulcan"]
[tool.setuptools.package-data]
vulcan=["static/*"]
[tool.pytest.ini_options]
testpaths=["tests"]
pythonpath=["."]
